<style>
/* Koncept: hledání nahoře, pod ním velké dlaždice. Dlaždice vedou do podnabídek a ty ke slevám, které vybírá Claude. */
:root{
  --bg:#FFFFFF; --surface:#F5F5F7; --ink:#1D1D1F; --muted:#6E6E73; --sep:rgba(0,0,0,.09);
  --accent:#1D1D1F; --accent-ink:#FFFFFF; --fill:rgba(0,0,0,.05);
  --good:#0A7D33; --good-bg:transparent; --danger:#C62828;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --ink:#F5F5F7; --muted:#98989D; --sep:rgba(255,255,255,.12);
  --accent:#F5F5F7; --accent-ink:#000000; --fill:rgba(255,255,255,.08); --good:#30D158; --danger:#FF6961; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --ink:#F5F5F7; --muted:#98989D; --sep:rgba(255,255,255,.12);
  --accent:#F5F5F7; --accent-ink:#000000; --fill:rgba(255,255,255,.08); --good:#30D158; --danger:#FF6961; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(56px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:2.125rem;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:.95rem;margin:4px 0 0}
.back{all:unset;box-sizing:border-box;color:var(--accent);cursor:pointer;font-size:1.05rem;padding:8px 0;display:inline-flex;align-items:center;gap:2px;min-height:44px}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);box-shadow:0 2px 12px rgba(120,70,20,.1);border-radius:999px;padding-left:6px;padding:0 12px;min-height:46px}
.search svg{flex:none;color:var(--muted)}
.search input{font:inherit;font-size:1.05rem;color:var(--ink);background:transparent;border:0;outline:0;width:100%;min-width:0;padding:11px 0;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search:focus-within{box-shadow:0 0 0 2px var(--accent)}
.go{all:unset;box-sizing:border-box;flex:none;color:var(--accent);font-weight:600;cursor:pointer;padding:8px 2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:0!important;gap:14px!important;padding:14px!important}.tile b{font-size:1.1rem!important}.ico{width:48px!important;height:48px!important;font-size:26px!important}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:24px;min-height:160px;box-shadow:0 2px 12px rgba(120,70,20,.08)}
.tile:focus-visible,.nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:30px;line-height:1}
.ico.cat{background:var(--t-cat)} .ico.food{background:var(--t-food)}
.tile b{display:block;font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.tile span.s{display:block;color:#555;font-size:.9rem;margin-top:2px}
.group{background:var(--surface);border-radius:20px;margin:0;padding:0;list-style:none;overflow:hidden}
.group>li+li{border-top:.5px solid var(--sep)}
.nav,.rowlink{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer;min-height:60px;color:inherit}
.chev{color:var(--muted);flex:none}
.left{display:flex;flex-direction:column;gap:2px;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.right{display:flex;flex-direction:column;align-items:flex-end;flex:none;gap:2px}
.price{font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.was{font-size:.8rem;color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.badge{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--good-bg);color:var(--good)}
.card{background:var(--surface);border-radius:20px;overflow:hidden}
.jhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:.5px solid var(--sep)}
.jhead b{overflow-wrap:anywhere}
.x{all:unset;cursor:pointer;color:var(--muted);font-size:1.4rem;line-height:1;padding:4px 8px;box-sizing:border-box}
.x:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.wait{display:flex;align-items:center;gap:10px;margin:0;padding:14px 16px 4px;font-weight:500}
.hint{margin:0;padding:0 16px 14px;color:var(--muted);font-size:.88rem}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--fill);border-top-color:var(--accent);flex:none}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.9s linear infinite}}
@keyframes sp{to{transform:rotate(360deg)}}
.sum{margin:0;padding:12px 16px;color:var(--muted);font-size:.9rem}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 16px;min-height:44px;cursor:pointer;background:var(--fill);color:var(--accent)}
.btn.red{color:var(--danger)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.status{font-size:.85rem;color:var(--muted);margin:0}
.empty{background:var(--surface);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted);font-size:.95rem}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font:inherit;font-size:.9rem;border:0;border-radius:999px;background:var(--surface);color:var(--ink);padding:8px 14px;min-height:36px;cursor:pointer;box-shadow:0 1px 4px rgba(120,70,20,.1)}.chip.on{background:var(--accent);color:#fff}.chip:focus-visible{outline:2px solid var(--accent)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1rem;flex:none}
.rowlink{align-items:center}
.row2{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.bar2{height:5px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:6px;max-width:140px}
.bar2 i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#34C759,#FF9F0A)}
.badge{font-size:.8rem!important;padding:3px 9px!important;background:#E4480F!important;color:#fff!important}
.price{color:var(--accent)}
.scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.dc{flex:none;width:168px;scroll-snap-align:start;background:var(--surface);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;box-shadow:0 2px 12px rgba(120,70,20,.1)}
.dc .pc{font-size:2rem;font-weight:800;letter-spacing:-.02em;color:#E4480F;line-height:1}
.dc .nm{font-weight:600;font-size:.95rem;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dc .pr{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums}
.dc .sh{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.82rem}
.dc .sh .av{width:24px;height:24px;font-size:.72rem}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:none;border-radius:12px}
.spark{display:block;margin-top:4px}
.tile{position:relative;overflow:hidden}
.tile .ico{background:rgba(255,255,255,.6)!important}

html{scroll-behavior:smooth}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tile,.chip,.btn,.nav,.rowlink,.dc,.back{transition:transform .15s ease,background-color .2s ease,opacity .2s ease,box-shadow .2s ease}
.tile:active,.chip:active,.btn:active,.dc:active{transform:scale(.96)}
.nav:active,.rowlink:active{background:var(--fill)}
.back:active{opacity:.5}
.btn:disabled{opacity:.55;cursor:default}
.sk{height:64px;background:linear-gradient(90deg,var(--fill) 25%,transparent 50%,var(--fill) 75%);background-size:200% 100%;border-radius:0}
.bar2 i{transition:width .6s ease}
@media (prefers-reduced-motion:no-preference){
  .enter>*{animation:rise .32s cubic-bezier(.2,.8,.2,1) both}
  .enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(n+5){animation-delay:.16s}
  #local>*{animation:rise .22s ease-out both}
  .sk{animation:shim 1.3s linear infinite}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}

.av{display:grid!important;place-items:center;width:32px!important;height:32px!important;border-radius:9px!important;background:var(--bg)!important;color:var(--ink)!important;margin-right:10px;flex:none}
.rw .rowlink{padding:14px 4px 14px 14px!important;gap:8px!important}
.rw .name{font-size:.95rem}
.rw .price{font-size:1.02rem!important}
.rw .meta{font-size:.8rem}
.rw{display:flex;align-items:stretch}
.rw .rowlink{flex:1;min-width:0}
.addb{all:unset;box-sizing:border-box;width:48px;flex:none;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.addb.in{color:var(--good)}
.addb:focus-visible,.chk:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:8px}
.chk{all:unset;box-sizing:border-box;width:22px;height:22px;margin:0 4px 0 16px;align-self:center;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.chk.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.soon{color:var(--danger);font-weight:600}
.hn{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
.hn.good{color:var(--good);font-weight:600}
.lab{font-size:.8rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 4px -6px}
[hidden]{display:none!important}

/* Čistý, dospělý vzhled: bez barevných dlaždic, stínů a ozdob */
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.03em}
.sub{font-size:.95rem}
.search{background:var(--surface)!important;box-shadow:none!important;border-radius:12px!important;padding-left:12px!important}
.chip{background:var(--surface)!important;box-shadow:none!important;border-radius:10px!important;font-size:.88rem!important;color:var(--ink)}
.chip.on{background:var(--ink)!important;color:var(--bg)!important}
.btn{background:var(--ink)!important;color:var(--bg)!important;border-radius:12px!important;font-weight:600}
.btn.red{background:var(--fill)!important;color:var(--danger)!important}
.group{border-radius:14px!important}
.card{border-radius:14px!important}
.tiles{gap:10px}
.tile{background:var(--surface)!important;box-shadow:none!important;border-radius:16px!important;color:var(--ink)!important;gap:22px!important;min-height:0!important;padding:16px!important}
.tile .ico{background:transparent!important;width:auto!important;height:auto!important;border-radius:0!important;display:block;font-size:0!important;color:var(--ink)}
.tile .ico svg{display:block}
.tile b{font-size:1rem!important;font-weight:600}
.tile span.s{color:var(--muted)!important;font-size:.82rem!important}
#local:empty{display:none}
.tile .ico{align-self:flex-start;text-align:left}
.bar2{display:none!important}
.row2{gap:0}
.price{color:var(--ink)!important;font-weight:600}
.badge{background:transparent!important;color:var(--good)!important;padding:0!important;font-size:.82rem!important;font-weight:600}
.dc{background:var(--surface)!important;box-shadow:none!important;border-radius:16px!important;width:176px!important;gap:6px!important}
.dc .pc{font-size:.85rem!important;font-weight:600!important;color:var(--good)!important;letter-spacing:0!important}
.dc .nm{font-weight:500!important;font-size:.92rem!important}
.dc .pr{font-size:1.2rem!important;font-weight:700!important;letter-spacing:-.01em}
.dc .sh{font-size:.78rem!important;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.lab{font-size:.78rem!important;letter-spacing:.06em!important}
.brand svg{border-radius:10px}

body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:flex;max-width:560px;margin:0 auto}
.tab{all:unset;box-sizing:border-box;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:.68rem;font-weight:500;color:var(--muted);cursor:pointer;min-height:56px}
.tab.on{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:-4px;border-radius:10px}
.ti{position:relative;display:block;height:26px}
.tb{position:absolute;top:-4px;right:-10px;min-width:16px;height:16px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:.65rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.shoptile{width:56px;height:56px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:1.05rem;letter-spacing:.04em;flex:none;margin-right:2px}
.shopnav{gap:14px!important}
.shopnav .left{flex:1;text-align:left;min-width:0}

.meta{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lrow .name,.row2 .name{text-align:left}

.av{width:44px!important;height:44px!important;border-radius:12px!important}
.av svg{width:24px;height:24px}
.lrow{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px}
.lrow .left{flex:1;min-width:0}
.av.big{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--bg);color:var(--ink);flex:none}
.pr2{font-weight:700;color:var(--ink)}
.stepper{display:flex;align-items:center;border:1px solid var(--sep);border-radius:999px;background:var(--bg);flex:none}
.stepper button{all:unset;box-sizing:border-box;width:30px;height:34px;display:grid;place-items:center;font-size:1.1rem;cursor:pointer;color:var(--ink)}

</style>

<script>
(function(){

    'mlecne': '<path d="M3 10l18-5v12H3z"/><path d="M3 10h18"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="13" r="1.2"/>',
    'napoje': '<path d="M7 4h10l-1.2 16H8.2z"/><path d="M7.4 9h9.2"/>',

    'kocky-jidlo': '<path d="M5 5l4 3h6l4-3v9a7 7 0 0 1-14 0z"/><circle cx="9.5" cy="13" r=".8"/><circle cx="14.5" cy="13" r=".8"/>'
  };
  function icon(k){return '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[k] + '</svg>'}
  var SHOPS = ['Kaufland', 'Lidl', 'Albert', 'Penny', 'Billa', 'Tesco', 'Globus'];
  var anim = true, updated = '';
  function loadShop(){try{var v = localStorage.getItem('cenovka-shop'); return v && v !== 'all' ? v : ''}catch(e){return ''}}

  var shopF = loadShop();
  var db = null, loaded = {deals: false};
  var deals = [], items = [], lst = [], hist = {}, sortF = 'sleva', route = '', note = '';
  var nf = new Intl.NumberFormat('cs-CZ', {maximumFractionDigits: 1});
  var nf2 = new Intl.NumberFormat('cs-CZ', {maximumFractionDigits: 2});
  var app = document.getElementById('app');

  function esc(s){return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function safeUrl(u){return /^https?:\/\//i.test(u || '') ? u : ''}
  function money(n, unit){return nf.format(n) + ' Kč' + (unit === 'kg' ? '/kg' : '')}
  function dmy(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); if (!m) return '';
    return parseInt(m[3], 10) + '. ' + parseInt(m[2], 10) + '.';
  }
  var CHEV = '<svg class="chev" width="9" height="15" viewBox="0 0 9 15" aria-hidden="true"><path d="M1.5 1.5l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function norm(t){return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()}
  function today(){var t = new Date(); return t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2)}

      return '<button type="button" class="chip' + (shopF === sh ? ' on' : '') + '" data-shop="' + esc(sh) + '">' + esc(sh) + '</button>'}).join('') + '</div>';
    var sorts = sortChips();
    return '<button type="button" class="back" data-go="">‹ Cenovka</button>' +
      '<header><h1>' + esc(d.title) + '</h1><p class="sub">' + esc(d.sub) + (upd ? ' · aktualizováno ' + dmy(upd) : '') + '</p></header>' + chips + sorts +
      (rows.length ? '<ul class="group">' + rows.map(resultRow).join('') + '</ul>' :
        (!loaded.deals ? '<ul class="group"><li class="sk"></li><li class="sk"></li><li class="sk"></li><li class="sk"></li></ul>' : (all.length ? '<div class="empty"><b>V tomto obchodě teď nic není</b>Zkuste jiný obchod nebo Vše.</div>' : '<div class="empty"><b>V této kategorii teď nejsou slevy</b>Podívejte se po další aktualizaci.</div>'))) +
      '<p class="status">Slevy se aktualizují každé pondělí a čtvrtek ráno.</p>' +
      (note ? '<p class="status">' + esc(note) + '</p>' : '');
  }
  function listScreen(){
    var open = lst.filter(function(x){return !x.done}), done = lst.filter(function(x){return x.done});
    var groups = {};
    open.forEach(function(x){var k = canon(x.shop); (groups[k] = groups[k] || []).push(x)});
    var kf = function(n){return n === 'Kaufland' ? 0 : 1};
    var names = Object.keys(groups).sort(function(a, b){return kf(a) - kf(b) || a.localeCompare(b, 'cs')});
    var total = 0, save = 0;
    open.forEach(function(x){var q = x.qty || 1; total += (x.price || 0) * q; var pp = pct(x); if (x.was && x.price && x.was > x.price) save += (x.was - x.price) * q; else if (pp && x.price) save += x.price * pp / (100 - pp) * q});
    function li(x){
      var q = x.qty || 1, un = x.unit === 'kg' ? 'kg' : 'ks', dl = daysLeft(x), end = dl !== null && dl < 0 ? '<span class="soon">sleva již není platná</span>' : untilText(x);
      return '<li class="lrow"><span class="av big" aria-hidden="true">' + itemIcon(x).replace(/^<span class="av"[^>]*>/, '').replace(/<\/span>$/, '') + '</span>' +
        '<span class="left"><span class="name"' + (x.done ? ' style="text-decoration:line-through;opacity:.5"' : '') + '>' + esc(x.name) + '</span>' +
        '<span class="meta"><b class="pr2">' + (x.price ? money(x.price, x.unit) : '–') + '</b>' + (end ? ' · ' + end : '') + '</span></span>' +
        '<span class="stepper"><button type="button" data-act="qm" data-id="' + esc(x.id) + '" aria-label="Méně">−</button><span class="qv" aria-label="' + q + ' ' + un + '">' + q + '</span><button type="button" data-act="qp" data-id="' + esc(x.id) + '" aria-label="Více">+</button></span>' +
        '<button type="button" class="chk' + (x.done ? ' on' : '') + '" data-act="toggle" data-id="' + esc(x.id) + '" aria-label="' + (x.done ? 'Vrátit mezi nenakoupené' : 'Označit jako nakoupené') + '">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.500 4.500L19 7.500"/></svg></button>' +
        '<button type="button" class="lx" data-act="lrm" data-id="' + esc(x.id) + '" aria-label="Odebrat ze seznamu">×</button></li>';
    }
    return '<header><h1>Nákupní seznam</h1></header>' +
      (open.length ? '<div class="sumcard"><span>Cena nákupu</span><span><b>' + money(Math.round(total * 10) / 10) + '</b>' + (save > 0.5 ? ' <span class="sv">ušetříte ' + money(Math.round(save)) + '</span>' : '') + '</span></div>' : '') +
      (!lst.length ? '<div class="empty"><b>Seznam je prázdný</b>Ve slevách klepněte na + vedle položky.</div>' : '') +
      names.map(function(n){return '<p class="lab">' + esc(n) + '</p><ul class="group lg">' + groups[n].map(li).join('') + '</ul>'}).join('') +
      (done.length ? '<p class="lab">Nakoupeno</p><ul class="group lg">' + done.map(li).join('') + '</ul><div class="bar"><button class="btn" type="button" data-act="clear">Smazat nakoupené</button></div>' : '');
  }
  function watched(){
    var rows = items.filter(function(i){return i.status !== 'koupeno'}).map(function(it){
      var ps = (it.prices || []).filter(function(x){return x && x.p > 0}), cur = ps.length ? ps[ps.length - 1] : null;
      return '<li><div class="rowlink" style="cursor:default"><span class="left"><span class="name">' + esc(it.name) + '</span><span class="meta">' +
        (it.target ? 'cíl ' + money(it.target, it.unit) : 'bez cílové ceny') + (cur && cur.shop ? ' · ' + esc(cur.shop) : '') + '</span>' + spark(ps) + '</span>' +
        '<span class="right"><span class="price">' + (cur ? money(cur.p, it.unit) : '–') + '</span>' +
        '</span></div></li>';
    });
    return '<button type="button" class="back" data-go="">‹ Cenovka</button><header><h1>Sledované věci</h1><p class="sub">Kontrola každé pondělí a čtvrtek ráno.</p></header>' +
      (rows.length ? '<ul class="group">' + rows.join('') + '</ul>' : '<div class="empty"><b>Nic nesledujete</b>Věci se přidávají v chatu s Claude.</div>');
  }

  function localMatches(q){
    var words = norm(q).split(/\s+/).filter(Boolean); if (!words.length) return [];
    var pool = liveDeals(), seen = {};
    return pool.filter(function(r){
      var hay = norm((r.name || '') + ' ' + (r.shop || '') + ' ' + (r.note || ''));
      var k = hay + '|' + r.price; if (seen[k]) return false; seen[k] = 1;
      return words.every(function(w){return hay.indexOf(w) >= 0});
    }).sort(function(a, b){return (a.price || 1e12) - (b.price || 1e12)}).slice(0, 15);
  }
  function updateLocal(){
    var box = document.getElementById('local'), q = document.getElementById('sq'); if (!box || !q) return;
    var t = q.value.trim();
    if (!t){box.innerHTML = ''; return}
    var m = localMatches(t);
    box.innerHTML = (m.length ? '<p class="lab">Už nalezeno · ' + m.length + '</p><ul class="group">' + m.map(resultRow).join('') + '</ul>' : '<div class="empty"><b>V aktuálních slevách nic není</b>Zkuste jiné slovo.</div>') +
      '<p class="status">Nenašlo se? Napište Claude do chatu, co hledáte, a najde to na internetu.</p>';
  }
  function render(){
    var html;
    if (DEALS[route]) html = dealScreen(route);
    else if (route === 'obchody') html = shopsScreen();
    else if (route.indexOf('obchod-') === 0) html = shopScreen(route);
    else if (route === 'akce') html = akceScreen();
    else if (route === 'sledovane') html = watched();
    else if (route === 'seznam') html = listScreen();
    else html = home();
    var keep = document.getElementById('sq'), val = keep ? keep.value : '', had = keep && document.activeElement === keep;
    app.className = 'wrap' + (anim ? ' enter' : ''); anim = false;
    app.innerHTML = html;
    var q = document.getElementById('sq');
    if (q && val){q.value = val; if (had) q.focus()}
    updateLocal();
    var tb = document.getElementById('tabs'); if (tb) tb.innerHTML = tabbar();
  }

  function go(r){
    route = r; note = ''; anim = true;
    if (location.hash.slice(1) !== r) location.hash = r;
    render(); window.scrollTo(0, 0);
  }

  app.addEventListener('click', function(e){
    var sh = e.target.closest('[data-shop]'); if (sh){shopF = sh.getAttribute('data-shop'); saveShop(shopF); render(); return}
    var ct = e.target.closest('[data-cat]'); if (ct){catF = ct.getAttribute('data-cat'); render(); return}
    var so = e.target.closest('[data-sort]'); if (so){sortF = so.getAttribute('data-sort'); render(); return}
    var c = e.target.closest('.chip[data-q]'); if (c){var qi = document.getElementById('sq'); qi.value = c.getAttribute('data-q'); updateLocal(); return}
    var g = e.target.closest('[data-go]'); if (g){go(g.getAttribute('data-go')); return}
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    if (act === 'list' && db){
      var dd = deals.filter(function(x){return x.id === id})[0];
      if (dd) db.doc('list/' + key(dd)).set({name: dd.name, price: dd.price || null, was: dd.was || null, unit: dd.unit || '', qty: 1, shop: dd.shop || '', until: dd.until || '', note: dd.note || '', url: dd.url || '', done: false, addedAt: new Date().toISOString()}).catch(function(){note = 'Přidání se nepovedlo.'; render()});
    }
    else if (act === 'unlist' && db){var d2 = deals.filter(function(x){return x.id === id})[0]; if (d2) db.doc('list/' + key(d2)).delete().catch(function(){})}
    else if ((act === 'qp' || act === 'qm') && db){var q0 = lst.filter(function(x){return x.id === id})[0]; if (q0) db.doc('list/' + id).update({qty: Math.max(1, (q0.qty || 1) + (act === 'qp' ? 1 : -1))})}
    else if (act === 'toggle' && db){var it = lst.filter(function(x){return x.id === id})[0]; if (it) db.doc('list/' + id).update({done: !it.done}).catch(function(){})}
    else if (act === 'lrm' && db) db.doc('list/' + id).delete().catch(function(){})
    else if (act === 'clear' && db) lst.filter(function(x){return x.done}).forEach(function(x){db.doc('list/' + x.id).delete().catch(function(){})})
  });
  app.addEventListener('submit', function(e){
    if (e.target.id !== 'sForm') return;
    e.preventDefault();
    updateLocal();
  });
  app.addEventListener('input', function(e){if (e.target.id === 'sq') updateLocal()});
  document.getElementById('tabs').addEventListener('click', function(e){var g = e.target.closest('[data-go]'); if (g) go(g.getAttribute('data-go'))});
  window.addEventListener('hashchange', function(){route = location.hash.slice(1); anim = true; render(); window.scrollTo(0, 0)});
  route = location.hash.slice(1);
  render();

  function status(m){note = m; render()}
  function loadList(){try{lst = JSON.parse(localStorage.getItem('cenovka-list') || '[]')}catch(e){lst = []}}
  function saveList(){try{localStorage.setItem('cenovka-list', JSON.stringify(lst))}catch(e){}}
  loadList();
  db = {
    doc: function(path){
      var id = path.split('/')[1];
      return {
        set: function(d){lst = lst.filter(function(x){return x.id !== id}); d.id = id; lst.push(d); saveList(); render(); return Promise.resolve()},
        update: function(d){lst.forEach(function(x){if (x.id === id) Object.assign(x, d)}); saveList(); render(); return Promise.resolve()},
        delete: function(){lst = lst.filter(function(x){return x.id !== id}); saveList(); render(); return Promise.resolve()}
      };
    }
  };
  fetch('data.json?v=' + Date.now()).then(function(r){return r.json()}).then(function(d){
    deals = d.deals || []; hist = d.hist || {}; items = d.items || []; updated = d.updated || '';
    loaded.deals = true; render();
  }).catch(function(){status('Data se nepodařilo načíst. Zkontrolujte připojení.')});
})();
</script>
